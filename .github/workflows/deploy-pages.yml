# Workflow : build et déploye le dossier `build/` sur GitHub Pages à chaque push sur main
# Modifiez `npm run build` et `path: build` si votre projet utilise une autre commande ou dossier (ex: `dist`).
name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ] # changez si votre branche par défaut est 'master' ou autre

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v1
        with:
          path: build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
